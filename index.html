<html>
<head>
<title>ZhacNocha</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #000;
    color: #fff;
    font-family: Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
}

.container {
    padding: 20px;
}

h1 {
    font-size: 25px;
    font-weight: normal;
    line-height: 1.6;
    margin-bottom: 15px;
}

.names {
    color: #777;
    font-size: 15px;
    margin-bottom: 30px;
}

.song-title {
    color: #777;
    font-size: 13px;
    margin-bottom: 12px;
}

button {
    background: transparent;
    color: #fff;
    border: 1px solid #555;
    padding: 10px 22px;
    font-size: 14px;
    cursor: pointer;
}

button:hover {
    background: #fff;
    color: #000;
}
</style>
</head>

<body>

<div class="container">

    <h1>
        Bazı isimler tanınır,<br>
        bazıları hafızalara kazınır.
    </h1>

    <div class="names">
        Nocha &amp; Bink &amp; 801
    </div>

    <p class="song-title">Kaybolan Yıllarımıza :)</p>

    <button onclick="startMusic()" id="musicButton">
        Müziği Başlat
    </button>

    <audio id="music" loop>
        <source src="https://zhacmedya.com/zhacm%C3%BCzik.mp3" type="audio/mpeg">
    </audio>

</div>

<script>
function startMusic() {
    const music = document.getElementById("music");
    const button = document.getElementById("musicButton");

    if (music.paused) {
        music.play().then(() => {
            button.textContent = "Müziği Durdur";
        }).catch(() => {
            button.textContent = "Müzik açılamadı";
        });
    } else {
        music.pause();
        button.textContent = "Müziği Başlat";
    }
}
</script>
     <p class="song-title">(ctrl+U</p>

</body>
</html>
